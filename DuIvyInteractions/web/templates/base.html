<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>DII Web — {{ title }}</title>
<style>
body{font:13px/1.5 system-ui,sans-serif;margin:0;display:flex}
nav{width:180px;min-height:100vh;background:#f5f6f7;border-right:1px solid #ddd;padding:12px}
main{flex:1;padding:16px;max-width:1200px}
h1{font-size:16px} h2{font-size:14px}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ddd;padding:4px 8px;text-align:right}
th{background:#f5f6f7;cursor:pointer}
td:first-child,th:first-child{text-align:left}
.card{display:inline-block;vertical-align:top;border:1px solid #ddd;border-radius:6px;padding:10px;margin:6px;width:230px}
form.inline{display:inline}
</style>
</head>
<body>
<nav>
  <h1>DII Web</h1>
  <p><a href="/">总览</a></p>
  {% if datasource %}
  <p><b>数据源</b><br><code style="font-size:11px">{{ datasource }}</code></p>
  {% endif %}
  {% for c in cards %}<p><a href="/type/{{ c.type }}">{{ c.type }}</a> ({{ c.n_pairs }})</p>{% endfor %}
</nav>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
