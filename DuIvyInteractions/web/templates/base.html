<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DII · {{ title }}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">DII</span><span>DuIvyInteractions</span></a>
</header>
<div class="layout">
  {% if types %}
  <aside class="sidebar">
    <div class="side-actions">
      <a class="side-action" href="/?add=1">+ load</a>
      <a class="side-action" href="/run">+ run</a>
    </div>
    {% for b in batches %}
    <div class="side-batch">
      <div class="side-batch-head">
        <span class="side-batch-name" title="{{ b.path }}">{{ b.name }}</span>
        <span class="side-batch-count">{{ b.n_types }}</span>
        <form method="post" action="/select/remove">
          <input type="hidden" name="path" value="{{ b.path }}">
          <button type="submit" class="side-batch-remove" aria-label="remove">×</button>
        </form>
      </div>
      {% for t in b.types %}
      <a class="side-item{% if t.name == active_type %} active{% endif %}" data-t="{{ t.base }}" href="/type/{{ t.name | urlencode }}">
        <span class="dot"></span><span class="side-label">{{ t.base }}</span><span class="side-count">{{ t.n_pairs }}</span>
      </a>
      {% endfor %}
    </div>
    {% endfor %}
    <form method="post" action="/select/clear" class="side-clear">
      <button type="submit">clear all</button>
    </form>
  </aside>
  {% endif %}
  <main class="content">{% block main %}{% endblock %}</main>
</div>
<div id="toast" class="toast hidden" role="status"></div>
{% block scripts %}{% endblock %}
<script>
(function () {
  var toast = document.getElementById('toast');
  var timer = null;
  window.showToast = function (text, sticky) {
    if (timer) { clearTimeout(timer); timer = null; }
    if (!text) { toast.classList.add('hidden'); return; }
    toast.textContent = text;
    toast.classList.remove('hidden');
    if (!sticky) {
      timer = setTimeout(function () { toast.classList.add('hidden'); }, 4000);
    }
  };
})();
</script>
</body>
</html>
